<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="一問一答">
<meta name="theme-color" content="#16191C">
<title>すきま一問一答</title>
<style>
:root{
  --bg:#16191c;
  --surface:#1e2328;
  --raised:#252c32;
  --line:#333b42;
  --ink:#e7eaec;
  --dim:#939ca4;
  --faint:#5e686f;
  --kokugo:#b8776c;
  --shakai:#6d93b8;
  --rika:#7ea37f;
  --ok:#86a97f;
  --ng:#c2726b;
  --accent:var(--shakai);
  --mincho:"Hiragino Mincho ProN","HiraMinProN-W3","Yu Mincho",YuMincho,"Noto Serif JP","Times New Roman",serif;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP","Helvetica Neue",Arial,sans-serif;
  --top:env(safe-area-inset-top,0px);
  --bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
body{
  font-family:var(--gothic);
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
button,textarea,input{font-family:inherit;font-size:inherit;color:inherit;touch-action:manipulation;}
button{border:none;background:none;padding:0;cursor:pointer;}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
#root{min-height:100vh;}
.kokugo{--accent:var(--kokugo);}
.shakai{--accent:var(--shakai);}
.rika{--accent:var(--rika);}

/* ---- 共通レイアウト ---- */
.screen{
  max-width:560px;margin:0 auto;
  padding:calc(var(--top) + 14px) 16px calc(var(--bottom) + 16px);
  min-height:100vh;
}
.quiz{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  padding-bottom:calc(var(--bottom) + 10px);
}

/* ---- ホーム ---- */
.home-head{padding:10px 2px 20px;}
.wordmark{
  font-family:var(--mincho);
  font-size:26px;font-weight:600;letter-spacing:.14em;
  margin:0;
}
.sub{margin:6px 0 0;color:var(--dim);font-size:13px;letter-spacing:.02em;}
.menu{display:flex;flex-direction:column;gap:10px;}
.menu-row{display:flex;gap:10px;}
.menu-row .start{flex:1;}
.start{
  display:flex;align-items:baseline;gap:10px;
  width:100%;min-height:62px;
  padding:14px 16px 14px 18px;
  background:var(--surface);
  border-left:3px solid var(--accent);
  border-radius:3px;
  text-align:left;
}
.start:active{background:var(--raised);}
.start[disabled]{opacity:.4;}
.start-name{font-size:18px;letter-spacing:.06em;}
.start-meta{margin-left:auto;font-size:12px;color:var(--dim);letter-spacing:.04em;white-space:nowrap;}
.start.wide{border-left-color:var(--line);min-height:56px;}
.menu-row .start{flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;padding:12px 14px;}
.menu-row .start-name{font-size:16px;}
.menu-row .start-meta{margin-left:0;}

/* ---- パネル ---- */
.panel{margin-top:26px;}
.panel-title{
  font-size:13px;font-weight:400;color:var(--dim);
  margin:0 0 12px;padding-bottom:8px;
  border-bottom:1px solid var(--line);
  letter-spacing:.08em;
}
.empty{color:var(--faint);font-size:13px;margin:0 0 10px;}
.bars{list-style:none;margin:0;padding:0;}
.bar-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px;}
.bar-label{width:8.4em;flex:none;color:var(--dim);letter-spacing:.01em;font-size:12.5px;white-space:nowrap;}
.bar-track{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden;}
.bar-fill{display:block;height:100%;background:var(--accent);}
.bar-val{width:3.2em;text-align:right;color:var(--dim);font-size:12px;}
.hint{margin:14px 0 0;font-size:13px;color:var(--dim);}
.link{
  display:block;width:100%;margin-top:30px;padding:14px;
  color:var(--dim);font-size:13px;text-align:center;
  border-top:1px solid var(--line);
}
.ver{text-align:center;color:var(--faint);font-size:11px;margin:16px 0 0;}

/* ---- 出題 ---- */
.quiz-head{
  display:flex;align-items:center;gap:10px;
  padding:calc(var(--top) + 10px) 16px 10px;
  flex:none;
}
.back{width:34px;height:34px;margin-left:-8px;color:var(--dim);font-size:19px;line-height:1;}
.tag{font-size:12px;color:var(--dim);letter-spacing:.06em;}
.dots{margin-left:auto;display:flex;gap:4px;align-items:center;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--line);}
.dot-now{background:none;box-shadow:inset 0 0 0 1px var(--dim);}
.dot-o{background:var(--ok);}
.dot-x{background:var(--ng);}

.stem{
  flex:1;display:flex;align-items:center;
  padding:18px 20px 22px;overflow-y:auto;
}
.stem-text{
  font-family:var(--mincho);
  font-size:20px;line-height:1.85;letter-spacing:.03em;
  margin:0;
}

.choices{
  display:flex;flex-direction:column;gap:9px;
  padding:0 14px;flex:none;
}
.choice{
  min-height:58px;padding:13px 16px;
  background:var(--raised);
  border:1px solid transparent;border-radius:4px;
  text-align:left;line-height:1.5;font-size:15.5px;
  letter-spacing:.02em;
  transition:background .08s linear;
}
.choice:active{background:#2e363d;}
.choice.locked{opacity:.55;}
.choice.is-answer{opacity:1;border-color:var(--ok);background:var(--raised);}
.choice.is-miss{opacity:1;border-color:var(--ng);color:var(--ng);}

.foot{flex:none;min-height:82px;padding:12px 14px 0;display:flex;align-items:stretch;}
.foot-hint{
  margin:auto;color:var(--faint);font-size:12px;letter-spacing:.1em;
}
.result-bar{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:12px 14px;border-radius:4px;text-align:left;
  background:var(--surface);border-left:3px solid var(--ok);
}
.result-bar.ng{border-left-color:var(--ng);}
.result-bar .mark{font-size:17px;flex:none;color:var(--ok);}
.result-bar.ng .mark{color:var(--ng);}
.result-bar .explain{font-size:12.5px;line-height:1.5;color:var(--dim);flex:1;}
.result-bar .go{font-size:12px;color:var(--ink);flex:none;letter-spacing:.06em;}

/* ---- 結果 ---- */
.score{padding:26px 4px 22px;}
.score-num{
  font-family:var(--mincho);
  font-size:56px;line-height:1;margin:0;letter-spacing:.02em;
}
.score-den{font-size:20px;color:var(--dim);margin-left:8px;}
.score-note{margin:14px 0 0;color:var(--dim);font-size:13.5px;}
.review{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);}
.review-item{padding:14px 0 14px 14px;border-bottom:1px solid var(--line);border-left:2px solid var(--accent);}
.review-q{font-family:var(--mincho);font-size:15px;line-height:1.7;margin:0;}
.review-a{margin:8px 0 0;font-size:14.5px;color:var(--ok);}
.review-e{margin:4px 0 0;font-size:12.5px;color:var(--dim);}
.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:26px;}

/* ---- データ ---- */
.data .panel{margin-top:22px;}
.row2{display:flex;gap:10px;margin-bottom:10px;}
.link-btn{
  flex:1;padding:13px 8px;background:var(--surface);
  border-radius:3px;font-size:13.5px;color:var(--ink);
}
.link-btn[disabled]{opacity:.4;}
.ta{
  width:100%;background:var(--bg);color:var(--dim);
  border:1px solid var(--line);border-radius:3px;
  padding:10px;font-size:12px;line-height:1.5;resize:vertical;
}
.msg{font-size:13px;color:var(--accent);margin:16px 2px 0;}

@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
@media (min-width:600px){
  .stem-text{font-size:22px;}
  .choice{font-size:16.5px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<script>
var APP_VERSION = "1.1.0";
/* 起動時に自分自身を取りにいき、埋めこまれた APP_VERSION が違えば読みこみ直す */
(function () {
  try {
    if (location.protocol === "file:") return;
    if (sessionStorage.getItem("ichimon-reloaded")) return;
    var url = location.href.split("#")[0].split("?")[0] + "?_=" + Date.now();
    fetch(url, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (t) {
        if (!t) return;
        var m = t.match(/APP_VERSION\s*=\s*"([^"]+)"/);
        if (m && m[1] !== APP_VERSION) {
          sessionStorage.setItem("ichimon-reloaded", "1");
          location.reload();
        }
      })
      .catch(function () {});
  } catch (e) {}
})();
</script>
<script>
var QUESTIONS = [
/* ===== 国語：同音異字 20問 ===== */
{id:"do1",s:"国語",f:"同音異字",q:"「小学生をタイショウにした本」の「タイショウ」はどれですか。",c:["対象","対照","対称","大将"],a:0,e:"働きかける相手やねらいの範囲は「対象」。"},
{id:"do2",s:"国語",f:"同音異字",q:"「二つの色をタイショウ的に使う」の「タイショウ」はどれですか。",c:["対照","対象","対称","大将"],a:0,e:"照らし合わせて違いが目立つのは「対照」。左右がつり合うのは「対称」。"},
{id:"do3",s:"国語",f:"同音異字",q:"「校庭を地域の人にカイホウする」の「カイホウ」はどれですか。",c:["開放","解放","介抱","快方"],a:0,e:"あけはなつのは「開放」。しばりから自由にするのは「解放」。"},
{id:"do4",s:"国語",f:"同音異字",q:"「祖父の病気がカイホウに向かう」の「カイホウ」はどれですか。",c:["快方","開放","解放","介抱"],a:0,e:"病気がよくなる方へ向かうのは「快方」。看病することは「介抱」。"},
{id:"do5",s:"国語",f:"同音異字",q:"「品質をホショウする」の「ホショウ」はどれですか。",c:["保証","保障","補償","包装"],a:0,e:"確かだと請け合うのは「保証」。"},
{id:"do6",s:"国語",f:"同音異字",q:"「社会ホショウの制度」の「ホショウ」はどれですか。",c:["保障","保証","補償","歩哨"],a:0,e:"安全や権利を守るのは「保障」。損害をつぐなうのは「補償」。"},
{id:"do7",s:"国語",f:"同音異字",q:"「真理をツイキュウする」の「ツイキュウ」はどれですか。",c:["追究","追求","追及","追給"],a:0,e:"深くきわめるのは「追究」。手に入れようと追い求めるのは「追求」。"},
{id:"do8",s:"国語",f:"同音異字",q:"「責任をツイキュウする」の「ツイキュウ」はどれですか。",c:["追及","追求","追究","追給"],a:0,e:"問いつめるのは「追及」。"},
{id:"do9",s:"国語",f:"同音異字",q:"「切手をシュウシュウする」の「シュウシュウ」はどれですか。",c:["収集","収拾","修習","収縮"],a:0,e:"集めるのは「収集」。"},
{id:"do10",s:"国語",f:"同音異字",q:"「混乱をシュウシュウする」の「シュウシュウ」はどれですか。",c:["収拾","収集","修習","収縮"],a:0,e:"乱れをおさめてまとめるのは「収拾」。"},
{id:"do11",s:"国語",f:"同音異字",q:"「客を迎えるタイセイを整える」の「タイセイ」はどれですか。",c:["態勢","体制","体勢","大勢"],a:0,e:"その場に向けた身構えは「態勢」。社会や組織のしくみは「体制」。"},
{id:"do12",s:"国語",f:"同音異字",q:"「イシの強い人」の「イシ」はどれですか。",c:["意志","意思","医師","遺志"],a:0,e:"やりとげようとする強い気持ちは「意志」。"},
{id:"do13",s:"国語",f:"同音異字",q:"「本人のイシを確認する」の「イシ」はどれですか。",c:["意思","意志","医師","遺志"],a:0,e:"どうしたいかという考えは「意思」。亡くなった人の願いは「遺志」。"},
{id:"do14",s:"国語",f:"同音異字",q:"「二本の線がヘイコウしている」の「ヘイコウ」はどれですか。",c:["平行","並行","平衡","閉口"],a:0,e:"交わらない線は「平行」。ならんで進むのは「並行」。つり合いは「平衡」。"},
{id:"do15",s:"国語",f:"同音異字",q:"「キカイ体操の選手」の「キカイ」はどれですか。",c:["器械","機械","機会","奇怪"],a:0,e:"道具や装置は「器械」。動力で動く大きな仕掛けは「機械」。"},
{id:"do16",s:"国語",f:"同音異字",q:"「絶好のキカイをのがす」の「キカイ」はどれですか。",c:["機会","機械","器械","奇怪"],a:0,e:"ちょうどよいおりは「機会」。"},
{id:"do17",s:"国語",f:"同音異字",q:"「答えのケントウもつかない」の「ケントウ」はどれですか。",c:["見当","検討","健闘","見等"],a:0,e:"だいたいの予想は「見当」。よく調べて考えるのは「検討」。"},
{id:"do18",s:"国語",f:"同音異字",q:"「問題点をケントウする」の「ケントウ」はどれですか。",c:["検討","見当","健闘","剣道"],a:0,e:"よく調べて考えるのは「検討」。よく戦うのは「健闘」。"},
{id:"do19",s:"国語",f:"同音異字",q:"「新しい文化をソウゾウする」の「ソウゾウ」はどれですか。",c:["創造","想像","創増","層造"],a:0,e:"新しくつくり出すのは「創造」。心に思いえがくのは「想像」。"},
{id:"do20",s:"国語",f:"同音異字",q:"「実験のカテイを記録する」の「カテイ」はどれですか。",c:["過程","課程","仮定","家庭"],a:0,e:"物事が進む道すじは「過程」。学習の内容や順序は「課程」。"},
/* ===== 国語：文法 15問 ===== */
{id:"b1",s:"国語",f:"文法",q:"次のうち、「ない」が一語の形容詞であるものはどれですか。",c:["この道は車が少ない","ぼくは何も知らない","まだ兄は帰らない","暗くて何も見えない"],a:0,e:"「少ない」は一語の形容詞。他は動詞について打ち消しを表す助動詞。"},
{id:"b2",s:"国語",f:"文法",q:"次のうち、「だ」が断定の助動詞であるものはどれですか。",c:["彼は六年生だ","この部屋は静かだ","町はにぎやかだ","字がきれいだ"],a:0,e:"他の三つは形容動詞の一部(語尾)。"},
{id:"b3",s:"国語",f:"文法",q:"次のうち、「れる・られる」が受け身の意味で使われているものはどれですか。",c:["弟に本をやぶられる","朝五時に起きられる","故郷のことがしのばれる","校長先生が話される"],a:0,e:"順に受け身・可能・自発・尊敬。四つの意味を見分けられるようにする。"},
{id:"b4",s:"国語",f:"文法",q:"次のうち、「られる」が可能の意味で使われているものはどれですか。",c:["朝五時に起きられる","先生に注意される","昔のことが思い出される","お客様が来られる"],a:0,e:"「〜することができる」と言いかえられれば可能。"},
{id:"b5",s:"国語",f:"文法",q:"次のうち、「れる・られる」が尊敬の意味で使われているものはどれですか。",c:["お客様が帰られる","犬にほえられる","一人で服が着られる","ふるさとが案じられる"],a:0,e:"目上の人の動作にそえて敬意を表す使い方。"},
{id:"b6",s:"国語",f:"文法",q:"次のうち、「そうだ」が人から聞いた話(伝聞)を表しているものはどれですか。",c:["明日は雨が降るそうだ","今にも雨が降りそうだ","そのケーキはおいしそうだ","かばんが重そうだ"],a:0,e:"言い切りの形につくと伝聞、「降り」のような形につくと様子を表す。"},
{id:"b7",s:"国語",f:"文法",q:"「決して」は、文の終わりでどのような言い方と組になりますか。",c:["〜ない","〜だろう","〜ようだ","〜か"],a:0,e:"「決して負けない」のように打ち消しと呼応する。"},
{id:"b8",s:"国語",f:"文法",q:"「まるで」は、文の終わりでどのような言い方と組になりますか。",c:["〜ようだ","〜ない","〜だろう","〜ても"],a:0,e:"「まるで夢のようだ」のようにたとえの言い方と呼応する。"},
{id:"b9",s:"国語",f:"文法",q:"「たとえ」は、文の中でどのような言い方と組になりますか。",c:["〜ても","〜ない","〜ようだ","〜そうだ"],a:0,e:"「たとえ雨が降っても行く」のように、仮に認める言い方と呼応する。"},
{id:"b10",s:"国語",f:"文法",q:"「妹が 大きな 声で 楽しそうに 歌う。」の「大きな」は、どの言葉を修飾していますか。",c:["声で","楽しそうに","歌う","妹が"],a:0,e:"修飾語は、すぐ後の「どんな声か」を説明している。"},
{id:"b11",s:"国語",f:"文法",q:"「兄の 作った 料理は とても おいしい。」の主語はどれですか。",c:["料理は","兄の","とても","おいしい"],a:0,e:"述語「おいしい」に対して「何が」にあたるのが主語。"},
{id:"b12",s:"国語",f:"文法",q:"「いちばん先に ゴールしたのは 弟だ。」の述語はどれですか。",c:["弟だ","ゴールしたのは","いちばん","先に"],a:0,e:"述語はふつう文の終わりにあり、「どうする・どんなだ・何だ」にあたる。"},
{id:"b13",s:"国語",f:"文法",q:"「大きな荷物」の「大きな」の品詞はどれですか。",c:["連体詞","形容詞","形容動詞","副詞"],a:0,e:"「大きな」は言い切りの形が変わらず、名詞だけを修飾する連体詞。「大きい」は形容詞。"},
{id:"b14",s:"国語",f:"文法",q:"次のうち、「の」が「こと」「もの」に置きかえられるものはどれですか。",c:["走るのが速い","ぼくの本を貸す","赤いのがほしい","弟の帽子だ"],a:0,e:"「走ることが速い」と言いかえられる。「ぼくの本」の「の」は持ち主を表す。"},
{id:"b15",s:"国語",f:"文法",q:"「しかし」「ところが」という接続語は、どのような働きをしますか。",c:["前とは反対の内容をつなぐ","前に付け加える","前の理由を述べる","話題を変える"],a:0,e:"逆接という。「だから」は順接、「また」は並立・添加。"},
/* ===== 国語：四字熟語 15問 ===== */
{id:"k01",s:"国語",f:"四字熟語",q:"「温故知新」の意味として正しいものはどれですか。",c:["昔のことをよく調べて、そこから新しい知識や考え方を得ること","古いやり方をすべて捨てて、新しいやり方に変えること","古くからの決まりを守り、新しいものを受け入れないこと","久しぶりに古い友人と会って昔話をすること"],a:0,e:"「故きを温ねて新しきを知る」と読み下す、『論語』に由来する言葉。"},
{id:"k02",s:"国語",f:"四字熟語",q:"「五里霧中」の意味として正しいものはどれですか。",c:["手がかりがなく、どうしてよいか見当がつかないこと","遠くまではっきりと見通せること","一つのことに夢中になって時間を忘れること","五里もの道のりを歩き通す根気強さのこと"],a:0,e:"深い霧の中にいるように、方針が立たない状態を表す。"},
{id:"k03",s:"国語",f:"四字熟語",q:"追いつめられて逃れようのない状態を表す四字熟語の、正しい書き方はどれですか。",c:["絶体絶命","絶対絶命","絶体絶明","絶大絶命"],a:0,e:"「絶対」ではなく「絶体」。体も命も極まる、という意味。"},
{id:"k04",s:"国語",f:"四字熟語",q:"「一朝一夕」の意味として正しいものはどれですか。",c:["ごくわずかな時間、短い期間","朝から晩まで休まず続けること","毎朝毎晩、欠かさず行うこと","朝と夕方で様子がすっかり変わること"],a:0,e:"「一朝一夕には身につかない」のように、打ち消しの形でよく使う。"},
{id:"k05",s:"国語",f:"四字熟語",q:"「異口同音」の意味として正しいものはどれですか。",c:["多くの人が口をそろえて同じことを言うこと","一人の人が場面によって違うことを言うこと","話し合っても意見がまとまらないこと","声の高さをそろえて歌うこと"],a:0,e:"読みは「いくどうおん」。「異句」と書くのは誤り。"},
{id:"k06",s:"国語",f:"四字熟語",q:"「単刀直入」の意味として正しいものはどれですか。",c:["前置きなしに、いきなり本題に入ること","たった一人で敵の中に切りこむ勇ましさのこと","遠回しに相手の気持ちをさぐること","短い言葉で分かりやすく説明すること"],a:0,e:"一本の刀だけを持って敵陣に切りこむ様子から生まれた言葉。"},
{id:"k07",s:"国語",f:"四字熟語",q:"「大器晩成」の意味として正しいものはどれですか。",c:["大人物は時間をかけて、後から力を発揮するということ","大きな器ほどこわれやすいということ","年をとってから物事を始めるのは遅すぎるということ","大きな目標は達成までに必ず失敗するということ"],a:0,e:"大きな器が完成までに時間がかかることにたとえた言葉。"},
{id:"k08",s:"国語",f:"四字熟語",q:"「我田引水」の意味として正しいものはどれですか。",c:["自分に都合のよいように物事を言ったり行ったりすること","自分の力だけで最後までやりとげること","他人の意見を素直に受け入れること","田畑を耕して生活を立てること"],a:0,e:"自分の田だけに水を引きこむ様子からできた言葉。"},
{id:"k09",s:"国語",f:"四字熟語",q:"「言語道断」の意味として正しいものはどれですか。",c:["もってのほかで、とんでもないこと","言葉をつくして相手を説得すること","何を言っても話が通じないこと","言葉が足りず誤解を招くこと"],a:0,e:"言葉で言い表す道が断たれるほどひどい、という意味。"},
{id:"k10",s:"国語",f:"四字熟語",q:"「千載一遇」の意味として正しいものはどれですか。",c:["めったに訪れない、またとないよい機会","千人に一人しかいないすぐれた人物","千年もの長い年月がかかること","一度会ったきり二度と会えないこと"],a:0,e:"「載」は年のこと。千年に一度しかめぐりあえない機会。"},
{id:"k11",s:"国語",f:"四字熟語",q:"「馬耳東風」の意味として正しいものはどれですか。",c:["人の意見や忠告を気にとめず、聞き流すこと","うわさが人から人へ速く伝わること","馬のように勢いよく走り回ること","春風のように穏やかな人がらのこと"],a:0,e:"心地よい春風が吹いても馬は何も感じないことから。"},
{id:"k13",s:"国語",f:"四字熟語",q:"「臨機応変」の意味として正しいものはどれですか。",c:["その場の状況に合わせて、適切に対応すること","決めた計画を最後まで変えずにやり通すこと","思いつきで行動して失敗すること","危険な場面をうまく避けて通ること"],a:0,e:"「機に臨んで変に応ずる」と読み下す。"},
{id:"k14",s:"国語",f:"四字熟語",q:"言葉に出さなくても気持ちが通じ合うことを表す「□心伝心」。□に入る漢字はどれですか。",c:["以","意","異","衣"],a:0,e:"「以心伝心」。心をもって心を伝える、という意味。"},
{id:"k15",s:"国語",f:"四字熟語",q:"「意味深長」の意味として正しいものはどれですか。",c:["表面の意味の他に、深い意味が隠されていること","意味が分かりにくく、内容がないこと","長い説明をしないと伝わらないこと","深く考えずに発言すること"],a:0,e:"「意味慎重」と書くのは誤り。読みは「いみしんちょう」。"},
{id:"k17",s:"国語",f:"四字熟語",q:"「厚顔無恥」の意味として正しいものはどれですか。",c:["あつかましく、恥を恥とも思わないこと","顔に出さずに恥ずかしさをこらえること","遠慮深く、人前に出たがらないこと","失敗しても気にせず前向きでいること"],a:0,e:"「厚顔」はあつかましいこと。ほめ言葉ではない。"},
/* ===== 国語：ことわざ・慣用句 12問 ===== */
{id:"p01",s:"国語",f:"ことわざ・慣用句",q:"「五十歩百歩」の意味として正しいものはどれですか。",c:["少しの違いはあっても、本質的には同じであること","努力の量によって大きな差がつくこと","少しずつ確実に前進すること","遠くに見えるものほど小さく見えること"],a:0,e:"戦いで五十歩逃げた者が百歩逃げた者を笑った故事から。"},
{id:"p04",s:"国語",f:"ことわざ・慣用句",q:"「情けは人のためならず」の正しい意味はどれですか。",c:["人に親切にすれば、めぐりめぐって自分に返ってくる","甘やかすことは、かえってその人のためにならない","人の情けをあてにして生きてはいけない","情けをかけるかどうかは相手を選ぶべきだ"],a:0,e:"「その人のためにならない」と取るのは誤り。ここでの「ならず」は打ち消し。"},
{id:"p05",s:"国語",f:"ことわざ・慣用句",q:"「弘法にも筆の誤り」の意味として正しいものはどれですか。",c:["すぐれた名人でも、ときには失敗することがある","道具のせいにするのは未熟な証拠だということ","字の上手な人ほど文章も上手だということ","失敗を重ねてこそ名人になれるということ"],a:0,e:"「猿も木から落ちる」「上手の手から水が漏れる」も同じ意味。"},
{id:"p07",s:"国語",f:"ことわざ・慣用句",q:"「灯台下暗し」の意味として正しいものはどれですか。",c:["身近なことは、かえって気づきにくいということ","暗いところでは判断を誤りやすいということ","高い場所からは遠くまで見えるということ","夜になると物事が悪い方へ進むということ"],a:0,e:"「灯台」は昔の室内用の照明具のこと。その真下は影になって暗い。"},
{id:"p09",s:"国語",f:"ことわざ・慣用句",q:"「漁夫の利」の意味として正しいものはどれですか。",c:["二者が争っている間に、第三者が利益を横取りすること","苦労して得たものほど価値があるということ","思いがけない幸運が舞いこむこと","協力すれば大きな成果が得られること"],a:0,e:"シギとハマグリが争う間に漁師が両方つかまえた故事から。"},
{id:"p10",s:"国語",f:"ことわざ・慣用句",q:"「蛇足」の意味として正しいものはどれですか。",c:["あってもしかたのない、余計な付け足し","こっそりと後をつけていくこと","長く曲がりくねった道のこと","動きがすばやく、つかまえにくいこと"],a:0,e:"絵の競争でヘビに足を描き足して負けた故事から。"},
{id:"p11",s:"国語",f:"ことわざ・慣用句",q:"「杞憂」の意味として正しいものはどれですか。",c:["しなくてもよい、取り越し苦労","先を見通した的確な心配","悲しみのあまり気力を失うこと","人に言えない深い悩みのこと"],a:0,e:"杞の国の人が「天が落ちてこないか」と心配した故事から。"},
{id:"p12",s:"国語",f:"ことわざ・慣用句",q:"「背水の陣」の意味として正しいものはどれですか。",c:["もう後がない状況に自分を置き、全力で取り組むこと","安全な場所から相手の様子をうかがうこと","水辺に陣地を構えて守りを固めること","仲間と背中を合わせて協力すること"],a:0,e:"川を背にして退路を断ち、味方を決死の覚悟にさせた故事から。"},
{id:"p17",s:"国語",f:"ことわざ・慣用句",q:"「気が置けない友人」とは、どのような友人ですか。",c:["遠慮がいらず、うちとけて付き合える友人","油断ができず、信用しにくい友人","いつも意見が対立してしまう友人","めったに会えない遠くの友人"],a:0,e:"気をつかって「置く」必要がない、という意味。誤用の多い言葉。"},
{id:"p18",s:"国語",f:"ことわざ・慣用句",q:"「彼にはこの役は役不足だ」と言ったとき、本来の意味はどれですか。",c:["その人の力量に対して、役目の方が軽すぎる","その人の力量が、役目に対して足りない","その役を務める人の人数が足りない","その役はだれにとっても難しすぎる"],a:0,e:"力量が足りない場合は「力不足」を使う。誤用の多い言葉。"},
{id:"p19",s:"国語",f:"ことわざ・慣用句",q:"「油を売る」の意味として正しいものはどれですか。",c:["無駄話をして、仕事をなまけること","自分の得意なことを人に自慢すること","もうけを独り占めすること","相手のきげんを取ること"],a:0,e:"江戸時代の油売りが客と長話をしながら商売した様子から。"},
{id:"p20",s:"国語",f:"ことわざ・慣用句",q:"「木で鼻をくくる」の意味として正しいものはどれですか。",c:["とても無愛想な受け答えをすること","強引に相手を言い負かすこと","下手なごまかしをすること","がまん強く痛みにたえること"],a:0,e:"そっけない態度を表す慣用句。"},
/* ===== 国語：漢字の読み 8問 ===== */
{id:"d01",s:"国語",f:"漢字の読み",q:"「境内」の読み方はどれですか。",c:["けいだい","きょうない","けいない","さかいうち"],a:0,e:"神社や寺の敷地の中のこと。"},
{id:"d02",s:"国語",f:"漢字の読み",q:"「名残」の読み方はどれですか。",c:["なごり","めいざん","なざん","なのこり"],a:0,e:"物事が過ぎ去った後に残る気配や思いのこと。"},
{id:"d04",s:"国語",f:"漢字の読み",q:"「風情」の読み方はどれですか。",c:["ふぜい","ふうじょう","ふうぜい","かざなさけ"],a:0,e:"しみじみとした味わいのこと。"},
{id:"d05",s:"国語",f:"漢字の読み",q:"「精進」の読み方はどれですか。",c:["しょうじん","せいしん","しょうしん","せいじん"],a:0,e:"一つのことに打ちこんではげむこと。"},
{id:"d11",s:"国語",f:"漢字の読み",q:"「建立」の読み方はどれですか。",c:["こんりゅう","けんりつ","けんりゅう","こんりつ"],a:0,e:"寺や塔などを建てること。歴史の問題でもよく出る。"},
{id:"d12",s:"国語",f:"漢字の読み",q:"「厳かな式典」の「厳か」の読み方はどれですか。",c:["おごそか","きびしか","げんか","おごそやか"],a:0,e:"重々しく、近寄りがたい様子のこと。"},
{id:"d14",s:"国語",f:"漢字の読み",q:"「潔い態度」の「潔い」の読み方はどれですか。",c:["いさぎよい","きよい","けつい","いさましい"],a:0,e:"思い切りがよく、見苦しくない様子。送りがなは「潔い」。"},
{id:"d15",s:"国語",f:"漢字の読み",q:"「ご注文を承る」の「承る」の読み方はどれですか。",c:["うけたまわる","うけとる","しょうる","うかがる"],a:0,e:"「受ける」「聞く」のへりくだった言い方。"},
/* ===== 社会：地理 20問 ===== */
{id:"g01",s:"社会",f:"地理",q:"日本アルプスのうち、「中央アルプス」と呼ばれるのはどの山脈ですか。",c:["木曽山脈","飛驒山脈","赤石山脈","奥羽山脈"],a:0,e:"北アルプス＝飛驒、中央アルプス＝木曽、南アルプス＝赤石。"},
{id:"g02",s:"社会",f:"地理",q:"日本で最も長い川はどれですか。",c:["信濃川","利根川","石狩川","北上川"],a:0,e:"長さ日本一は信濃川、流域面積日本一は利根川。区別して覚える。"},
{id:"g03",s:"社会",f:"地理",q:"流域面積が日本最大の川はどれですか。",c:["利根川","信濃川","最上川","筑後川"],a:0,e:"関東平野を流れる利根川。長さ日本一の信濃川と混同しないこと。"},
{id:"g04",s:"社会",f:"地理",q:"三陸海岸に見られる、山地が沈んでできた出入りの複雑な海岸を何といいますか。",c:["リアス海岸","砂丘海岸","さんご礁海岸","干潟"],a:0,e:"波が穏やかで水深があるため、養殖や漁港に適する。志摩半島や若狭湾も同じ。"},
{id:"g05",s:"社会",f:"地理",q:"夏に東北地方の太平洋側へ吹き、冷害の原因となる冷たい北東の風を何といいますか。",c:["やませ","からっ風","おろし","季節風のフェーン"],a:0,e:"日照不足と低温をもたらし、稲の生育をさまたげる。"},
{id:"g06",s:"社会",f:"地理",q:"冬に関東平野へ吹き下ろす、冷たく乾いた風を何といいますか。",c:["からっ風","やませ","偏西風","貿易風"],a:0,e:"山をこえて水分を失った季節風。冬の関東が晴れて乾燥する原因。"},
{id:"g07",s:"社会",f:"地理",q:"瀬戸内の気候の特徴として正しいものはどれですか。",c:["一年を通して降水量が少ない","夏も冬も降水量が非常に多い","冬の降雪量が全国でも特に多い","一年中気温が低く冷涼である"],a:0,e:"中国山地と四国山地に季節風がさえぎられるため。ため池が多いのもこのため。"},
{id:"g08",s:"社会",f:"地理",q:"日本海側で冬に雪が多く降る理由として正しいものはどれですか。",c:["北西の季節風が暖流の上を通って水蒸気を含み、山地にぶつかるから","南東の季節風が太平洋の水蒸気を運んでくるから","台風が冬に日本海側を通過することが多いから","日本海の水温が冬に特に低くなるから"],a:0,e:"風が山をこえた後の太平洋側は、乾いた晴天になる。"},
{id:"g09",s:"社会",f:"地理",q:"寒流と暖流がぶつかり、好漁場となる場所を何といいますか。",c:["潮目(潮境)","大陸だな","海溝","半島"],a:0,e:"三陸沖では寒流の親潮と暖流の黒潮がぶつかる。"},
{id:"g10",s:"社会",f:"地理",q:"鹿児島県に広がる、火山灰が積もってできた台地を何といいますか。",c:["シラス台地","根釧台地","武蔵野台地","北上高地"],a:0,e:"水もちが悪く稲作に向かないため、さつまいもや茶の畑作・畜産がさかん。"},
{id:"g11",s:"社会",f:"地理",q:"石狩平野で稲作ができるようになった、土地の改良方法を何といいますか。",c:["客土","促成栽培","輪作","干拓"],a:0,e:"泥炭地に他の場所から良い土を運び入れて土地を改良した。"},
{id:"g12",s:"社会",f:"地理",q:"北海道で、じゃがいも・小麦・てんさいなどの畑作がさかんな平野はどれですか。",c:["十勝平野","石狩平野","庄内平野","越後平野"],a:0,e:"同じ作物を続けて作らない「輪作」が行われている。"},
{id:"g13",s:"社会",f:"地理",q:"北海道東部の根釧台地でさかんな農業はどれですか。",c:["乳牛を飼って牛乳や乳製品をつくる酪農","水田での稲作","みかんなどの果樹栽培","茶の栽培"],a:0,e:"夏でも冷涼で霧が多く、作物が育ちにくいため牧草地として利用された。"},
{id:"g14",s:"社会",f:"地理",q:"甲府盆地の扇状地でさかんな農業はどれですか。",c:["ぶどう・ももなどの果樹栽培","稲作","酪農","茶の栽培"],a:0,e:"扇状地は水はけがよいため、水田より果樹園に向く。"},
{id:"g15",s:"社会",f:"地理",q:"高知平野や宮崎平野で、ビニールハウスを使って出荷時期を早める栽培方法を何といいますか。",c:["促成栽培","抑制栽培","二毛作","焼畑農業"],a:0,e:"他の産地が出荷しない時期に出すことで高く売れる。"},
{id:"g16",s:"社会",f:"地理",q:"長野県の高原で、夏の涼しい気候を生かしてレタスやキャベツの出荷時期を遅らせる栽培方法を何といいますか。",c:["抑制栽培","促成栽培","客土","輪作"],a:0,e:"高原野菜とも呼ばれる。野辺山原などが有名。"},
{id:"g17",s:"社会",f:"地理",q:"日本の標準時子午線(東経135度)が通る都市はどれですか。",c:["兵庫県明石市","京都府京都市","静岡県浜松市","岡山県岡山市"],a:0,e:"日本の時刻はこの経線を基準に決められている。"},
{id:"g18",s:"社会",f:"地理",q:"日本の最東端にある島はどれですか。",c:["南鳥島","沖ノ鳥島","与那国島","択捉島"],a:0,e:"最南端＝沖ノ鳥島、最西端＝与那国島、最北端＝択捉島。"},
{id:"g19",s:"社会",f:"地理",q:"愛知県を中心に広がり、自動車工業など機械工業がさかんな工業地帯はどれですか。",c:["中京工業地帯","京浜工業地帯","阪神工業地帯","北九州工業地帯"],a:0,e:"豊田市の自動車工業が中心。工業生産額は全国有数。"},
{id:"g20",s:"社会",f:"地理",q:"関東地方から九州北部にかけて、工業地帯・工業地域が帯のように連なる地域を何といいますか。",c:["太平洋ベルト","日本アルプス","フォッサマグナ","環太平洋造山帯"],a:0,e:"原料の輸入と製品の輸出に便利な臨海部に工業が集まった。"},
/* ===== 社会：気候区 6問 ===== */
{id:"kq1",s:"社会",f:"気候区",q:"冬の降水量(降雪量)が特に多く、夏は比較的晴れる気候区はどれですか。",c:["日本海側の気候","太平洋側の気候","中央高地の気候","瀬戸内の気候"],a:0,e:"北西の季節風が暖流の上で水蒸気を含み、山地にぶつかって雪を降らせる。"},
{id:"kq2",s:"社会",f:"気候区",q:"夏に降水量が多く、冬は乾燥して晴れの日が続く気候区はどれですか。",c:["太平洋側の気候","日本海側の気候","北海道の気候","南西諸島の気候"],a:0,e:"夏は南東の季節風が雨をもたらし、冬は山をこえた乾いた風がふく。"},
{id:"kq3",s:"社会",f:"気候区",q:"一年を通して降水量が少なく、冬でも比較的温暖な気候区はどれですか。",c:["瀬戸内の気候","日本海側の気候","中央高地の気候","北海道の気候"],a:0,e:"中国山地と四国山地に季節風がさえぎられるため。ため池が多い。"},
{id:"kq4",s:"社会",f:"気候区",q:"夏と冬の気温の差が大きく、冬の平均気温が0度を下回り、降水量は一年中少ない気候区はどれですか。",c:["中央高地の気候","瀬戸内の気候","太平洋側の気候","南西諸島の気候"],a:0,e:"内陸の気候ともいう。雨温図では低温と少雨の組み合わせで見分ける。"},
{id:"kq5",s:"社会",f:"気候区",q:"冬の寒さがきびしく、梅雨がほとんど見られない気候区はどれですか。",c:["北海道の気候","日本海側の気候","中央高地の気候","瀬戸内の気候"],a:0,e:"冷帯(亜寒帯)に属し、年間の降水量も比較的少ない。"},
{id:"kq6",s:"社会",f:"気候区",q:"一年中気温が高く降水量も多い、日本の南のはしの気候区はどれですか。",c:["南西諸島の気候","太平洋側の気候","瀬戸内の気候","北海道の気候"],a:0,e:"亜熱帯に属し、台風の通り道にもあたる。"},
/* ===== 社会：歴史 23問 ===== */
{id:"h01",s:"社会",f:"歴史",q:"十七条の憲法や冠位十二階を定めた人物はだれですか。",c:["聖徳太子","中大兄皇子","聖武天皇","藤原道長"],a:0,e:"推古天皇の摂政として、天皇中心の政治のしくみを整えた。"},
{id:"h02",s:"社会",f:"歴史",q:"645年、中大兄皇子と中臣鎌足が蘇我氏をたおして始めた政治改革を何といいますか。",c:["大化の改新","建武の新政","大宝律令","墾田永年私財法"],a:0,e:"天皇中心の国づくりを目指し、公地公民の方針が示された。"},
{id:"h03",s:"社会",f:"歴史",q:"710年に都が移された場所はどこですか。",c:["平城京","平安京","藤原京","長岡京"],a:0,e:"今の奈良市。唐の長安にならって造られた。794年には平安京へ移る。"},
{id:"h04",s:"社会",f:"歴史",q:"東大寺の大仏をつくらせた天皇はだれですか。",c:["聖武天皇","推古天皇","天智天皇","桓武天皇"],a:0,e:"仏教の力で国を安定させようとした。行基が大仏づくりに協力した。"},
{id:"h05",s:"社会",f:"歴史",q:"894年に遣唐使の停止を提案した人物はだれですか。",c:["菅原道真","藤原道長","坂上田村麻呂","小野妹子"],a:0,e:"唐がおとろえたことなどを理由とした。以後、国風文化が育つ。"},
{id:"h06",s:"社会",f:"歴史",q:"京都の宇治に平等院鳳凰堂を建てた人物はだれですか。",c:["藤原頼通","藤原道長","足利義満","平清盛"],a:0,e:"父の道長とともに摂関政治の全盛期を築いた。十円玉に描かれている建物。"},
{id:"h07",s:"社会",f:"歴史",q:"源頼朝が幕府を開いた場所はどこですか。",c:["鎌倉","京都","江戸","平泉"],a:0,e:"三方を山、一方を海に囲まれた守りやすい地形だった。"},
{id:"h08",s:"社会",f:"歴史",q:"1221年に承久の乱を起こした人物はだれですか。",c:["後鳥羽上皇","後醍醐天皇","北条政子","平将門"],a:0,e:"幕府をたおそうとしたが敗れ、幕府の力は西日本にも広がった。"},
{id:"h09",s:"社会",f:"歴史",q:"元寇(元軍の襲来)のときの鎌倉幕府の執権はだれですか。",c:["北条時宗","北条泰時","北条時政","源実朝"],a:0,e:"文永の役と弘安の役の2回。御家人への恩賞が不十分で幕府はおとろえた。"},
{id:"h10",s:"社会",f:"歴史",q:"京都の北山に金閣を建てた室町幕府の将軍はだれですか。",c:["足利義満","足利義政","足利尊氏","足利義昭"],a:0,e:"銀閣を建てたのは孫の足利義政。書院造で有名。"},
{id:"h11",s:"社会",f:"歴史",q:"1543年に鉄砲が伝えられた島はどこですか。",c:["種子島","屋久島","対馬","隠岐"],a:0,e:"ポルトガル人を乗せた船が漂着した。後に堺や国友で生産された。"},
{id:"h12",s:"社会",f:"歴史",q:"1549年に日本にキリスト教を伝えた人物はだれですか。",c:["フランシスコ・ザビエル","マルコ・ポーロ","ペリー","ハリス"],a:0,e:"鹿児島に上陸したイエズス会の宣教師。"},
{id:"h13",s:"社会",f:"歴史",q:"市場の税をなくし、だれでも自由に商売できるようにした「楽市・楽座」を行った人物はだれですか。",c:["織田信長","豊臣秀吉","徳川家康","武田信玄"],a:0,e:"安土城下で行われた。座の特権をなくし、商工業を活発にした。"},
{id:"h14",s:"社会",f:"歴史",q:"太閤検地と刀狩を行った人物はだれですか。",c:["豊臣秀吉","織田信長","徳川家光","源頼朝"],a:0,e:"武士と農民の身分をはっきり分ける「兵農分離」が進んだ。"},
{id:"h15",s:"社会",f:"歴史",q:"1600年の関ヶ原の戦いに勝ち、江戸幕府を開いた人物はだれですか。",c:["徳川家康","徳川家光","石田三成","徳川吉宗"],a:0,e:"1603年に征夷大将軍となった。"},
{id:"h16",s:"社会",f:"歴史",q:"参勤交代を武家諸法度に定めた将軍はだれですか。",c:["徳川家光","徳川家康","徳川綱吉","徳川吉宗"],a:0,e:"大名は1年おきに江戸と領地を行き来した。大名の出費がかさんだ。"},
{id:"h17",s:"社会",f:"歴史",q:"鎖国の間、長崎の出島で貿易を許されたヨーロッパの国はどこですか。",c:["オランダ","ポルトガル","スペイン","イギリス"],a:0,e:"キリスト教の布教を行わなかったため許された。中国とも長崎で貿易した。"},
{id:"h18",s:"社会",f:"歴史",q:"享保の改革を行った将軍はだれですか。",c:["徳川吉宗","松平定信","水野忠邦","田沼意次"],a:0,e:"目安箱の設置や公事方御定書の制定を行った。寛政＝松平定信、天保＝水野忠邦。"},
{id:"h19",s:"社会",f:"歴史",q:"1853年に軍艦を率いて浦賀に来航し、日本に開国を求めた人物はだれですか。",c:["ペリー","ザビエル","ハリス","ラクスマン"],a:0,e:"翌1854年に日米和親条約が結ばれ、下田と函館が開かれた。"},
{id:"h20",s:"社会",f:"歴史",q:"政権を朝廷に返す「大政奉還」を行った将軍はだれですか。",c:["徳川慶喜","徳川家茂","徳川家定","井伊直弼"],a:0,e:"1867年。これにより約260年続いた江戸幕府が終わった。"},
{id:"h21",s:"社会",f:"歴史",q:"自由民権運動を進め、自由党をつくった人物はだれですか。",c:["板垣退助","大隈重信","伊藤博文","西郷隆盛"],a:0,e:"民撰議院設立の建白書を出した。立憲改進党をつくったのは大隈重信。"},
{id:"h22",s:"社会",f:"歴史",q:"大日本帝国憲法づくりの中心となり、初代内閣総理大臣となった人物はだれですか。",c:["伊藤博文","大久保利通","木戸孝允","陸奥宗光"],a:0,e:"1889年発布。君主の権限が強いドイツ(プロイセン)の憲法を手本とした。"},
{id:"h23",s:"社会",f:"歴史",q:"日清戦争の講和条約はどれですか。",c:["下関条約","ポーツマス条約","日米和親条約","ベルサイユ条約"],a:0,e:"日露戦争の講和条約はポーツマス条約。セットで覚える。"},
/* ===== 社会：時代順 7問 ===== */
{id:"h24",s:"社会",f:"時代順",q:"次のできごとのうち、最も古い時代に起こったものはどれですか。",c:["大化の改新","応仁の乱","承久の乱","関ヶ原の戦い"],a:0,e:"大化の改新(645年)→承久の乱(1221年)→応仁の乱(1467年)→関ヶ原の戦い(1600年)。"},
{id:"h25",s:"社会",f:"時代順",q:"次のできごとを古い順に並べたとき、最も新しいものはどれですか。",c:["参勤交代の制度化","鉄砲の伝来","太閤検地","関ヶ原の戦い"],a:0,e:"鉄砲伝来(1543)→太閤検地(1582〜)→関ヶ原の戦い(1600)→参勤交代の制度化(1635)。"},
{id:"j1",s:"社会",f:"時代順",q:"次のできごとのうち、平安時代に起こったものはどれですか。",c:["遣唐使の停止","楽市・楽座","参勤交代の制度化","元寇"],a:0,e:"遣唐使の停止は894年。元寇は鎌倉、楽市・楽座は安土桃山、参勤交代は江戸。"},
{id:"j2",s:"社会",f:"時代順",q:"次のできごとのうち、最も古いものはどれですか。",c:["元寇","応仁の乱","鉄砲の伝来","関ヶ原の戦い"],a:0,e:"元寇(1274・1281)→応仁の乱(1467)→鉄砲の伝来(1543)→関ヶ原の戦い(1600)。"},
{id:"j3",s:"社会",f:"時代順",q:"江戸時代の三つの改革のうち、最も古いものはどれですか。",c:["享保の改革","寛政の改革","天保の改革","建武の新政"],a:0,e:"享保(徳川吉宗)→寛政(松平定信)→天保(水野忠邦)の順。建武の新政は室町時代の直前。"},
{id:"j4",s:"社会",f:"時代順",q:"次の明治時代のできごとのうち、最も古いものはどれですか。",c:["西南戦争","大日本帝国憲法の発布","日清戦争","日露戦争"],a:0,e:"西南戦争(1877)→憲法発布(1889)→日清戦争(1894)→日露戦争(1904)。"},
{id:"j5",s:"社会",f:"時代順",q:"次のできごとのうち、最も新しいものはどれですか。",c:["日本の国際連合加盟","満州事変","太平洋戦争の開始","日本国憲法の公布"],a:0,e:"満州事変(1931)→太平洋戦争(1941)→憲法公布(1946)→国連加盟(1956)。"},
/* ===== 社会：公民 15問 ===== */
{id:"c01",s:"社会",f:"公民",q:"日本国憲法の三つの原則のうち、第9条に示されているものはどれですか。",c:["平和主義","国民主権","基本的人権の尊重","三権分立"],a:0,e:"戦争の放棄、戦力の不保持、交戦権の否認が定められている。"},
{id:"c02",s:"社会",f:"公民",q:"「国民主権」の意味として正しいものはどれですか。",c:["国の政治のあり方を最終的に決める力は国民にあるということ","国民は法律を守らなければならないということ","国民はだれでも平等に扱われるということ","国民が税金を納める義務があるということ"],a:0,e:"大日本帝国憲法では主権は天皇にあった。"},
{id:"c03",s:"社会",f:"公民",q:"国民の三大義務にあてはまらないものはどれですか。",c:["選挙で投票すること","税金を納めること","働くこと","子どもに教育を受けさせること"],a:0,e:"投票は義務ではなく権利(参政権)。"},
{id:"c04",s:"社会",f:"公民",q:"法律をつくる仕事を担当するのはどれですか。",c:["国会","内閣","裁判所","地方公共団体"],a:0,e:"国会＝立法、内閣＝行政、裁判所＝司法。これを三権分立という。"},
{id:"c05",s:"社会",f:"公民",q:"内閣総理大臣を指名するのはどれですか。",c:["国会","天皇","最高裁判所","国民の直接投票"],a:0,e:"国会議員の中から国会が指名し、天皇が任命する。"},
{id:"c06",s:"社会",f:"公民",q:"法律が憲法に違反していないかを最終的に判断するため、「憲法の番人」と呼ばれる機関はどれですか。",c:["最高裁判所","国会","内閣","会計検査院"],a:0,e:"この権限を違憲審査権という。"},
{id:"c07",s:"社会",f:"公民",q:"同じ事件について3回まで裁判を受けられるしくみを何といいますか。",c:["三審制","三権分立","陪審制","裁判員制度"],a:0,e:"まちがった判決を防ぎ、人権を守るためのしくみ。"},
{id:"c08",s:"社会",f:"公民",q:"裁判員制度が行われるのはどのような裁判ですか。",c:["重大な刑事事件の第一審","すべての民事裁判","最高裁判所の裁判","家庭裁判所の裁判"],a:0,e:"くじで選ばれた国民が裁判官とともに有罪・無罪や刑罰を決める。"},
{id:"c09",s:"社会",f:"公民",q:"衆議院議員の任期は何年ですか。",c:["4年","6年","3年","任期はない"],a:0,e:"衆議院は4年で解散あり、参議院は6年で3年ごとに半数を改選する。"},
{id:"c10",s:"社会",f:"公民",q:"国政選挙で投票できるのは何歳からですか。",c:["満18歳以上","満20歳以上","満16歳以上","満25歳以上"],a:0,e:"2016年から18歳以上に引き下げられた。立候補は衆議院25歳、参議院30歳から。"},
{id:"c11",s:"社会",f:"公民",q:"日本国憲法が定める天皇の地位はどれですか。",c:["日本国と日本国民統合の象徴","国の政治を最終的に決める主権者","国会の議決を取り消せる元首","軍隊を指揮する最高司令官"],a:0,e:"政治についての権限は持たず、内閣の助言と承認により国事行為を行う。"},
{id:"c12",s:"社会",f:"公民",q:"国際連合の安全保障理事会で、常任理事国だけが持つ権限を何といいますか。",c:["拒否権","先議権","調査権","委任権"],a:0,e:"常任理事国はアメリカ・イギリス・フランス・中国・ロシアの5か国。"},
{id:"c13",s:"社会",f:"公民",q:"世界遺産の登録を行う国際連合の専門機関はどれですか。",c:["ユネスコ(UNESCO)","ユニセフ(UNICEF)","WHO","WTO"],a:0,e:"教育・科学・文化を通じて平和を築くための機関。"},
{id:"c14",s:"社会",f:"公民",q:"世界の子どもたちの命と健康を守る活動をしている国連の機関はどれですか。",c:["ユニセフ(UNICEF)","ユネスコ(UNESCO)","IMF","NATO"],a:0,e:"国連児童基金。栄養・水・教育・予防接種などの支援を行う。"},
{id:"c15",s:"社会",f:"公民",q:"2030年までの達成を目指す、17の目標からなる国際的な取り組みを何といいますか。",c:["SDGs(持続可能な開発目標)","ODA","PKO","TPP"],a:0,e:"貧困や飢餓の解消、気候変動対策などが目標に含まれる。"},
/* ===== 理科：生物 15問 ===== */
{id:"s01",s:"理科",f:"生物",q:"植物が光合成によってつくり出すものの組み合わせとして正しいものはどれですか。",c:["デンプンと酸素","デンプンと二酸化炭素","水と酸素","水と二酸化炭素"],a:0,e:"二酸化炭素と水を材料に、日光のエネルギーを使ってつくる。"},
{id:"s02",s:"理科",f:"生物",q:"光合成が行われる、植物の細胞の中の緑色の粒を何といいますか。",c:["葉緑体","気孔","道管","師管"],a:0,e:"葉が緑色に見えるのは、この中の葉緑素(クロロフィル)のため。"},
{id:"s03",s:"理科",f:"生物",q:"植物の体の中の水が、水蒸気となって出ていくはたらきを何といいますか。",c:["蒸散","呼吸","光合成","発芽"],a:0,e:"おもに葉の裏側にある気孔から出ていく。根から水を吸い上げる力にもなる。"},
{id:"s04",s:"理科",f:"生物",q:"種子の発芽に必要な3つの条件として正しいものはどれですか。",c:["水・空気・適当な温度","水・日光・肥料","日光・空気・肥料","水・日光・適当な温度"],a:0,e:"発芽に日光と肥料は必要ない。養分は子葉にたくわえられている。"},
{id:"s05",s:"理科",f:"生物",q:"さなぎの時期がある「完全変態」をする昆虫はどれですか。",c:["カブトムシ","バッタ","トンボ","セミ"],a:0,e:"卵→幼虫→さなぎ→成虫。バッタ・トンボ・セミはさなぎにならない不完全変態。"},
{id:"s06",s:"理科",f:"生物",q:"昆虫のあしの本数と、ついている場所の組み合わせとして正しいものはどれですか。",c:["6本・胸","6本・腹","8本・胸","4本・胸と腹"],a:0,e:"体は頭・胸・腹の3つに分かれ、あしとはねは胸につく。"},
{id:"s07",s:"理科",f:"生物",q:"メダカの雄を見分ける特徴として正しいものはどれですか。",c:["背びれに切れこみがある","しりびれが三角形で小さい","体が雌より大きい","腹がふくらんでいる"],a:0,e:"雄は背びれに切れこみがあり、しりびれが平行四辺形に近い形で大きい。"},
{id:"s08",s:"理科",f:"生物",q:"だ液のはたらきによって、デンプンは何に変えられますか。",c:["糖","脂肪","たんぱく質","二酸化炭素"],a:0,e:"デンプンはヨウ素液で青紫色、糖はベネジクト液を加えて加熱すると赤かっ色になる。"},
{id:"s09",s:"理科",f:"生物",q:"消化された養分がおもに吸収される場所はどこですか。",c:["小腸","胃","大腸","かん臓"],a:0,e:"内側のかべにある柔毛から吸収される。大腸ではおもに水分が吸収される。"},
{id:"s10",s:"理科",f:"生物",q:"血液の中で酸素を運ぶはたらきをする成分はどれですか。",c:["赤血球","白血球","血小板","血しょう"],a:0,e:"赤血球にふくまれるヘモグロビンが酸素と結びつく。白血球は細菌と戦う。"},
{id:"s11",s:"理科",f:"生物",q:"肺の中で、酸素と二酸化炭素の交換が行われる小さなふくろを何といいますか。",c:["肺胞","気管支","横隔膜","気孔"],a:0,e:"数が非常に多く、表面積を広げて効率よく交換できるようになっている。"},
{id:"s12",s:"理科",f:"生物",q:"トウモロコシやイネなどの単子葉類に見られる特徴はどれですか。",c:["葉脈が平行で、根はひげ根","葉脈が網目状で、根は主根と側根","葉脈が平行で、根は主根と側根","葉脈が網目状で、根はひげ根"],a:0,e:"双子葉類(アサガオ・ヒマワリなど)は網状脈で主根と側根。"},
{id:"s13",s:"理科",f:"生物",q:"花のつくりのうち、受粉した後に果実になる部分はどこですか。",c:["子房","胚珠","がく","おしべ"],a:0,e:"子房→果実、胚珠→種子。セットで覚える。"},
{id:"s14",s:"理科",f:"生物",q:"デンプンにヨウ素液をつけると、何色に変わりますか。",c:["青紫色","赤色","緑色","白くにごる"],a:0,e:"デンプンがあるかどうかを調べるときに使う。"},
{id:"s15",s:"理科",f:"生物",q:"食物連鎖の出発点となり、「生産者」と呼ばれるのはどれですか。",c:["植物","草食動物","肉食動物","菌類"],a:0,e:"自分で養分をつくり出せるのは植物だけ。動物は消費者と呼ばれる。"},
/* ===== 理科：地学 15問 ===== */
{id:"e01",s:"理科",f:"地学",q:"日本で、太陽の南中高度が一年で最も高くなるのはいつごろですか。",c:["夏至のころ","冬至のころ","春分のころ","秋分のころ"],a:0,e:"南中高度が高いほど昼が長く、地面が受ける熱も多くなる。"},
{id:"e02",s:"理科",f:"地学",q:"月の満ち欠けがひとまわりするのに、およそ何日かかりますか。",c:["約29.5日","約15日","約7日","約365日"],a:0,e:"新月→三日月→上弦→満月→下弦→新月の順に変化する。"},
{id:"e03",s:"理科",f:"地学",q:"夏の大三角をつくる星の組み合わせはどれですか。",c:["ベガ・アルタイル・デネブ","ベテルギウス・シリウス・プロキオン","北極星・カシオペヤ・北斗七星","アンタレス・スピカ・アルタイル"],a:0,e:"こと座のベガ(織姫星)、わし座のアルタイル(彦星)、はくちょう座のデネブ。"},
{id:"e04",s:"理科",f:"地学",q:"冬の大三角をつくる星の組み合わせはどれですか。",c:["ベテルギウス・シリウス・プロキオン","ベガ・アルタイル・デネブ","リゲル・スピカ・デネブ","北極星・シリウス・ベガ"],a:0,e:"オリオン座のベテルギウス、おおいぬ座のシリウス、こいぬ座のプロキオン。"},
{id:"e05",s:"理科",f:"地学",q:"一晩中ほとんど位置が変わらないように見える星はどれですか。",c:["北極星","シリウス","ベガ","アンタレス"],a:0,e:"こぐま座の星で、地球の地軸のほぼ延長上にあるため動いて見えない。"},
{id:"e06",s:"理科",f:"地学",q:"星の色と表面温度の関係として正しいものはどれですか。",c:["青白い星ほど温度が高く、赤い星ほど温度が低い","赤い星ほど温度が高く、青白い星ほど温度が低い","色と温度には関係がない","黄色い星が最も温度が高い"],a:0,e:"ベテルギウスは赤く低温、リゲルは青白く高温。"},
{id:"e07",s:"理科",f:"地学",q:"夏の午後の夕立や、激しいにわか雨を降らせる雲はどれですか。",c:["積乱雲","巻雲","乱層雲","高積雲"],a:0,e:"上へ高く発達する雲で、かみなりを伴うことも多い。入道雲とも呼ばれる。"},
{id:"e08",s:"理科",f:"地学",q:"日本付近の天気が西から東へ移り変わるのは、おもに何のはたらきによるものですか。",c:["上空に吹く偏西風","地球の自転による遠心力","季節風","海流"],a:0,e:"このため、西の空の様子から次の日の天気をある程度予想できる。"},
{id:"e09",s:"理科",f:"地学",q:"寒冷前線が通過した後の気温の変化として正しいものはどれですか。",c:["急に下がる","急に上がる","ほとんど変わらない","上がってから下がる"],a:0,e:"積乱雲ができ、せまい範囲に短時間の強い雨が降る。"},
{id:"e10",s:"理科",f:"地学",q:"温暖前線が近づいてくるときの雨の降り方として正しいものはどれですか。",c:["広い範囲に弱い雨が長い時間降る","せまい範囲に強い雨が短時間降る","雨は降らず風だけが強くなる","雪に変わって積もる"],a:0,e:"乱層雲ができる。寒冷前線との違いをセットで覚える。"},
{id:"e11",s:"理科",f:"地学",q:"川が山地から平地に出るところにできる、扇形に広がった地形を何といいますか。",c:["扇状地","三角州","V字谷","河岸段丘"],a:0,e:"河口にできるのは三角州。扇状地は水はけがよく果樹園に使われる。"},
{id:"e12",s:"理科",f:"地学",q:"川が曲がって流れているところで、岸がけずられて深くなるのはどちら側ですか。",c:["外側","内側","両方同じ","水面に近い方"],a:0,e:"外側は流れが速くしん食され、内側は流れがおそく土砂がたい積する。"},
{id:"e13",s:"理科",f:"地学",q:"サンゴの化石が見つかったとき、その地層ができた当時の環境として考えられるのはどれですか。",c:["あたたかく浅い海","冷たく深い海","乾燥した砂漠","寒冷な高山"],a:0,e:"当時の環境が分かる化石を示相化石という。"},
{id:"e14",s:"理科",f:"地学",q:"アンモナイトの化石が見つかった地層は、いつの時代のものだと分かりますか。",c:["中生代","古生代","新生代","現代"],a:0,e:"時代が分かる化石を示準化石という。サンヨウチュウは古生代。"},
{id:"e15",s:"理科",f:"地学",q:"地震のゆれの大きさを、その場所ごとに表したものはどれですか。",c:["震度","マグニチュード","震源","活断層"],a:0,e:"マグニチュードは地震そのものの規模を表し、1つの地震に1つの値。"},
/* ===== 理科：化学 15問 ===== */
{id:"x01",s:"理科",f:"化学",q:"水が氷になるとき、体積はどうなりますか。",c:["増える","減る","変わらない","半分になる"],a:0,e:"体積が増えて同じ体積あたりの重さが軽くなるため、氷は水に浮く。"},
{id:"x02",s:"理科",f:"化学",q:"水の温度を上げたとき、溶ける量が大きく増えるのはどちらですか。",c:["ミョウバン","食塩","どちらも同じように増える","どちらも変わらない"],a:0,e:"食塩は温度を上げてもほとんど変わらない。この違いは結晶の取り出し方に関わる。"},
{id:"x03",s:"理科",f:"化学",q:"青色リトマス紙を赤色に変えるのは、どの性質の水溶液ですか。",c:["酸性","中性","アルカリ性","性質に関係なく変わる"],a:0,e:"赤色リトマス紙を青色に変えるのはアルカリ性。"},
{id:"x04",s:"理科",f:"化学",q:"BTB液を加えたとき、黄色になるのはどの性質の水溶液ですか。",c:["酸性","中性","アルカリ性","水にだけ反応する"],a:0,e:"黄色＝酸性、緑色＝中性、青色＝アルカリ性。"},
{id:"x05",s:"理科",f:"化学",q:"うすい塩酸にアルミニウムを入れたとき、発生する気体はどれですか。",c:["水素","酸素","二酸化炭素","ちっ素"],a:0,e:"水素は最も軽い気体で、火を近づけるとポンと音を立てて燃える。"},
{id:"x06",s:"理科",f:"化学",q:"石灰水を白くにごらせる気体はどれですか。",c:["二酸化炭素","酸素","水素","アンモニア"],a:0,e:"二酸化炭素があるかどうかを調べるときに使う方法。"},
{id:"x07",s:"理科",f:"化学",q:"ものを燃やすはたらきがある気体はどれですか。",c:["酸素","二酸化炭素","ちっ素","水素"],a:0,e:"酸素自体は燃えない。火のついた線香を入れると激しく燃える。"},
{id:"x08",s:"理科",f:"化学",q:"鼻をさすにおいがあり、水にとてもよく溶けてアルカリ性を示す気体はどれですか。",c:["アンモニア","酸素","二酸化炭素","水素"],a:0,e:"水に溶けやすく空気より軽いため、上方置換法で集める。"},
{id:"x09",s:"理科",f:"化学",q:"うすい塩酸に水酸化ナトリウム水溶液を加えて中性にし、水を蒸発させると残るものはどれですか。",c:["食塩","石灰","砂糖","ミョウバン"],a:0,e:"酸とアルカリが打ち消し合うことを中和という。"},
{id:"x10",s:"理科",f:"化学",q:"炭酸水に溶けている気体はどれですか。",c:["二酸化炭素","酸素","水素","アンモニア"],a:0,e:"気体が溶けた水溶液なので、蒸発させても何も残らない。"},
{id:"x11",s:"理科",f:"化学",q:"水に溶けにくい気体を集めるのに適した方法はどれですか。",c:["水上置換法","上方置換法","下方置換法","ろ過"],a:0,e:"酸素や水素を集めるときに使う。空気が混ざらず純すいな気体を集められる。"},
{id:"x12",s:"理科",f:"化学",q:"次の金属のうち、磁石につくものはどれですか。",c:["鉄","アルミニウム","銅","金"],a:0,e:"金属に共通するのは、電気や熱を通しやすくみがくと光ること。磁石につくのは一部だけ。"},
{id:"x13",s:"理科",f:"化学",q:"スチールウール(鉄)を燃やした後の重さは、燃やす前と比べてどうなりますか。",c:["重くなる","軽くなる","変わらない","もえかすが飛ぶので半分になる"],a:0,e:"空気中の酸素と結びつくため。木や紙は気体が出ていくので軽くなる。"},
{id:"x14",s:"理科",f:"化学",q:"ろ過をするときの正しい方法はどれですか。",c:["液をガラス棒に伝わらせて注ぎ、ろうとの先はビーカーの内側につける","液をろ紙の中心にいきおいよく注ぐ","ろうとの先はビーカーにつけないようにする","ろ紙は水でぬらさずに使う"],a:0,e:"液がはねたり、ろ紙がずれたりするのを防ぐため。"},
{id:"x15",s:"理科",f:"化学",q:"食塩水を蒸発皿に入れて加熱し、水を蒸発させるとどうなりますか。",c:["食塩が白い固体となって残る","何も残らない","黒くこげたものが残る","水だけが残る"],a:0,e:"固体が溶けた水溶液は蒸発させると溶けていたものが残る。"},
/* ===== 理科：物理 15問 ===== */
{id:"f01",s:"理科",f:"物理",q:"てこが水平につり合うときの条件として正しいものはどれですか。",c:["左右で「おもりの重さ×支点からの距離」が等しい","左右のおもりの重さが等しい","左右の支点からの距離が等しい","左右で「おもりの重さ÷支点からの距離」が等しい"],a:0,e:"重いおもりは支点に近づけると、軽いおもりとつり合う。"},
{id:"f02",s:"理科",f:"物理",q:"ふりこが1往復する時間を決めるのは何ですか。",c:["ふりこの長さ","おもりの重さ","ふれはば","おもりの形"],a:0,e:"長さが長いほど1往復の時間は長くなる。重さやふれはばを変えても変わらない。"},
{id:"f03",s:"理科",f:"物理",q:"電磁石を強くする方法として正しいものはどれですか。",c:["コイルの巻き数を増やす","コイルの巻き数を減らす","導線を太くして長さを2倍にする","電池を並列につなぐ"],a:0,e:"流れる電流を大きくすることでも強くなる。電流の向きを変えると極が入れかわる。"},
{id:"f04",s:"理科",f:"物理",q:"豆電球1個に乾電池2個を直列につないだとき、豆電球の明るさはどうなりますか。",c:["乾電池1個のときより明るくなる","乾電池1個のときと同じ","暗くなる","光らなくなる"],a:0,e:"直列は電圧が大きくなり明るくなる。並列は明るさは変わらず、長持ちする。"},
{id:"f05",s:"理科",f:"物理",q:"光が鏡ではね返るときの、入射角と反射角の関係はどれですか。",c:["入射角と反射角は等しい","入射角の方が大きい","反射角の方が大きい","鏡の材質によって変わる"],a:0,e:"これを光の反射の法則という。"},
{id:"f06",s:"理科",f:"物理",q:"音が伝わらないのはどのような場所ですか。",c:["空気がない真空中","水の中","金属の中","気温が低いところ"],a:0,e:"音はものの振動が伝わる現象なので、振動を伝えるものが必要。"},
{id:"f07",s:"理科",f:"物理",q:"高い音が出ているとき、弦の振動はどうなっていますか。",c:["1秒間の振動の回数が多い","1秒間の振動の回数が少ない","振動のはばが大きい","振動のはばが小さい"],a:0,e:"弦を短く、細く、強く張ると高い音になる。振動のはばは音の大小に関係する。"},
{id:"f08",s:"理科",f:"物理",q:"金属のぼうの片方の端を熱したとき、熱が伝わる順番として正しいものはどれですか。",c:["熱した所から順に、近い方から遠い方へ伝わる","遠い方から先に温まる","全体が同時に温まる","上の方だけが温まる"],a:0,e:"固体を伝わる熱の伝わり方を伝導という。水や空気は対流で全体が温まる。"},
{id:"f09",s:"理科",f:"物理",q:"とじこめた空気を温めると、体積はどうなりますか。",c:["大きくなる","小さくなる","変わらない","一度小さくなってから戻る"],a:0,e:"体積の変化は、空気>水>金属の順に大きい。"},
{id:"f10",s:"理科",f:"物理",q:"水の中の物体が受ける、上向きの力を何といいますか。",c:["浮力","重力","まさつ力","弾性力"],a:0,e:"浮力の大きさは、物体が押しのけた水の重さに等しい。"},
{id:"f11",s:"理科",f:"物理",q:"動滑車を1つ使っておもりを持ち上げるとき、引く力の大きさはどうなりますか。",c:["半分になる","2倍になる","変わらない","4分の1になる"],a:0,e:"ただし引く長さは2倍になる。定滑車は力の向きを変えるだけ。"},
{id:"f12",s:"理科",f:"物理",q:"方位磁針のN極が北をさすのはなぜですか。",c:["地球が大きな磁石で、北極付近がS極になっているから","地球が大きな磁石で、北極付近がN極になっているから","北の方が気温が低いから","太陽の光が南から当たるから"],a:0,e:"磁石は異なる極どうしが引き合うため、N極が北をさす。"},
{id:"f13",s:"理科",f:"物理",q:"2つの磁石のN極どうしを近づけるとどうなりますか。",c:["しりぞけ合う","引き合う","何も起こらない","磁石の力がなくなる"],a:0,e:"異なる極どうしは引き合い、同じ極どうしはしりぞけ合う。"},
{id:"f14",s:"理科",f:"物理",q:"電流の大きさを表す単位はどれですか。",c:["アンペア(A)","ボルト(V)","ワット(W)","ヘルツ(Hz)"],a:0,e:"ボルトは電圧の単位。回路に流れる電流は電流計ではかる。"},
{id:"f15",s:"理科",f:"物理",q:"虫めがね(凸レンズ)で日光を集めると、どうなりますか。",c:["光が一点に集まり、その部分の温度が高くなる","光が広がって弱くなる","光の色が変わる","光が反射してもとの方向へ戻る"],a:0,e:"凸レンズは光を屈折させて集める。目を痛めるので太陽を直接見てはいけない。"},
/* ===== 理科：実験・器具 10問 ===== */
{id:"t1",s:"理科",f:"実験・器具",q:"ガスバーナーに火をつけるとき、マッチの火を近づけた後に最初に開くねじはどれですか。",c:["ガス調節ねじ","空気調節ねじ","元栓","コック"],a:0,e:"元栓→コックを開け、マッチの火を近づけてからガス調節ねじ、次に空気調節ねじの順。"},
{id:"t2",s:"理科",f:"実験・器具",q:"ガスバーナーの炎がオレンジ色のとき、どうすればよいですか。",c:["空気調節ねじを開けて空気を増やす","ガス調節ねじをしめる","元栓をしめる","そのまま使う"],a:0,e:"空気が足りない状態。空気を増やすと青い炎になり、温度が高くなる。"},
{id:"t3",s:"理科",f:"実験・器具",q:"上皿てんびんで物の重さをはかるとき、分銅はどの順に乗せますか。",c:["重いものから順に乗せる","軽いものから順に乗せる","真ん中の重さから乗せる","順番は関係ない"],a:0,e:"重い分銅から試し、重すぎたら次に軽いものに替える。分銅は必ずピンセットで扱う。"},
{id:"t4",s:"理科",f:"実験・器具",q:"メスシリンダーの目盛りの正しい読み方はどれですか。",c:["液面のへこんだ中央を、真横から読む","液面のへりの高い所を、真横から読む","液面の中央を、ななめ上から読む","目盛りの一番近い線まで読む"],a:0,e:"最小目盛りの10分の1まで目分量で読む。"},
{id:"t5",s:"理科",f:"実験・器具",q:"顕微鏡で観察を始めるとき、最初に使う対物レンズはどれですか。",c:["最も倍率の低いもの","最も倍率の高いもの","中くらいの倍率のもの","どれでもよい"],a:0,e:"低倍率で広く見て、見たいものを中央に移してから倍率を上げる。"},
{id:"t6",s:"理科",f:"実験・器具",q:"顕微鏡のピントを合わせるときの正しい操作はどれですか。",c:["対物レンズとプレパラートを離しながら合わせる","対物レンズとプレパラートを近づけながら合わせる","接眼レンズを回して合わせる","反射鏡を動かして合わせる"],a:0,e:"先に横から見て近づけておき、のぞきながら離す。ぶつけて割るのを防ぐため。"},
{id:"t7",s:"理科",f:"実験・器具",q:"接眼レンズが10倍、対物レンズが40倍のときの顕微鏡の倍率はどれですか。",c:["400倍","50倍","4倍","30倍"],a:0,e:"倍率は接眼レンズ×対物レンズで求める。"},
{id:"t8",s:"理科",f:"実験・器具",q:"水溶液のにおいを調べるときの正しい方法はどれですか。",c:["手であおいでにおいを鼻に送る","容器に鼻を近づけて直接かぐ","息を深く吸いこんでかぐ","容器をふってからかぐ"],a:0,e:"強い刺激のある気体を直接吸いこむと危険なため。"},
{id:"t9",s:"理科",f:"実験・器具",q:"試験管に入れた液体を加熱するときの注意として正しいものはどれですか。",c:["試験管の口を人のいない方へ向ける","試験管の口を自分の方へ向ける","液体を試験管いっぱいに入れる","一か所だけを動かさずに熱する"],a:0,e:"急に沸とうして飛び出すことがある。ときどきふり動かしながら熱する。"},
{id:"t10",s:"理科",f:"実験・器具",q:"条件を変えて調べる実験で、正しい進め方はどれですか。",c:["調べたい条件だけを変え、他の条件はそろえる","すべての条件を同時に変える","条件を変えずに何度もくり返す","結果に合わせて条件をあとから変える"],a:0,e:"対照実験という。何を比べているのかをはっきりさせるための基本。"},
];

</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ------------------------------------------------------------------ */
/* 保存データ                                                          */
/* ------------------------------------------------------------------ */
const KEY = "sukima-ichimon-v1";
const RECENT_MAX = 30;
const SET_SIZE = 10;

function emptyStore() {
  return { v: 1, q: {}, recent: [], streak: 0, last: "", done: 0 };
}

function loadStore() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return emptyStore();
    const s = JSON.parse(raw);
    return Object.assign(emptyStore(), s);
  } catch (e) {
    return emptyStore();
  }
}

function saveStore(s) {
  try {
    localStorage.setItem(KEY, JSON.stringify(s));
  } catch (e) {}
}

function today() {
  const d = new Date();
  const p = (n) => (n < 10 ? "0" + n : "" + n);
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function yesterday() {
  const d = new Date(Date.now() - 86400000);
  const p = (n) => (n < 10 ? "0" + n : "" + n);
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function touchStreak(s) {
  const t = today();
  if (s.last === t) return s;
  s.streak = s.last === yesterday() ? (s.streak || 0) + 1 : 1;
  s.last = t;
  return s;
}

function rec(store, id) {
  return store.q[id] || { o: 0, x: 0, w: 0, s: 0 };
}

/* ------------------------------------------------------------------ */
/* 出題                                                                */
/* ------------------------------------------------------------------ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i];
    a[i] = a[j];
    a[j] = t;
  }
  return a;
}

function buildSet(store, subject, onlyWrong) {
  let pool = QUESTIONS;
  if (subject) pool = pool.filter((q) => q.s === subject);
  if (onlyWrong) pool = pool.filter((q) => rec(store, q.id).w === 1);
  if (!pool.length) return [];

  /* 直近30問に出たものは出さない。ただし「まちがえた問題」は早めに戻す */
  const recent = new Set(store.recent || []);
  const justNow = new Set((store.recent || []).slice(0, 5));
  let fresh = pool.filter((q) =>
    rec(store, q.id).w === 1 ? !justNow.has(q.id) : !recent.has(q.id)
  );
  if (fresh.length < SET_SIZE) fresh = pool;

  const wrong = shuffle(fresh.filter((q) => rec(store, q.id).w === 1));
  const rest = fresh
    .filter((q) => rec(store, q.id).w !== 1)
    .map((q) => {
      const r = rec(store, q.id);
      return { q: q, seen: r.o + r.x, k: Math.random() };
    })
    .sort((a, b) => a.seen - b.seen || a.k - b.k)
    .map((o) => o.q);

  const wrongQuota = onlyWrong ? SET_SIZE : Math.min(4, wrong.length);
  let picked = wrong.slice(0, wrongQuota).concat(rest).slice(0, SET_SIZE);
  if (picked.length < SET_SIZE) {
    const have = new Set(picked.map((q) => q.id));
    picked = picked.concat(shuffle(pool.filter((q) => !have.has(q.id)))).slice(0, SET_SIZE);
  }

  return shuffle(picked).map((q) => {
    const order = shuffle([0, 1, 2, 3]);
    return {
      q: q,
      choices: order.map((i) => q.c[i]),
      answer: order.indexOf(q.a),
    };
  });
}

/* ------------------------------------------------------------------ */
/* 集計                                                                */
/* ------------------------------------------------------------------ */
const FIELDS = (function () {
  const seen = [];
  QUESTIONS.forEach((q) => {
    if (!seen.some((f) => f.s === q.s && f.f === q.f)) seen.push({ s: q.s, f: q.f });
  });
  return seen;
})();

function fieldStats(store) {
  return FIELDS.map((f) => {
    let o = 0,
      x = 0,
      w = 0;
    QUESTIONS.forEach((q) => {
      if (q.s !== f.s || q.f !== f.f) return;
      const r = rec(store, q.id);
      o += r.o;
      x += r.x;
      if (r.w === 1) w += 1;
    });
    return { s: f.s, f: f.f, o: o, x: x, w: w, n: o + x, rate: o + x ? Math.round((o / (o + x)) * 100) : null };
  });
}

function wrongCount(store, subject) {
  return QUESTIONS.filter((q) => (!subject || q.s === subject) && rec(store, q.id).w === 1).length;
}

const SUBJECTS = ["国語", "社会", "理科"];
const SUB_CLASS = { 国語: "kokugo", 社会: "shakai", 理科: "rika" };

/* ------------------------------------------------------------------ */
/* ホーム                                                              */
/* ------------------------------------------------------------------ */
function Home(props) {
  const store = props.store;
  const stats = useMemo(() => fieldStats(store), [store]);
  const wrongAll = wrongCount(store, null);
  const weak = stats.filter((s) => s.n >= 3).sort((a, b) => a.rate - b.rate)[0];

  return (
    <div className="screen home">
      <div className="home-head">
        <h1 className="wordmark">すきま一問一答</h1>
        <p className="sub">
          {store.done > 0
            ? "これまで" + store.done + "問" + (store.streak > 1 ? "　" + store.streak + "日つづけて" : "")
            : "1セット10問。1〜2分でおわります。"}
        </p>
      </div>

      <div className="menu">
        {SUBJECTS.map((s) => {
          const w = wrongCount(store, s);
          return (
            <button key={s} className={"start " + SUB_CLASS[s]} onClick={() => props.onStart(s, false)}>
              <span className="start-name">{s}</span>
              <span className="start-meta">{w > 0 ? "にがて " + w + "問" : "10問"}</span>
            </button>
          );
        })}
        <div className="menu-row">
          <button className="start wide" onClick={() => props.onStart(null, false)}>
            <span className="start-name">3教科まぜて</span>
          </button>
          <button
            className="start wide"
            disabled={wrongAll === 0}
            onClick={() => props.onStart(null, true)}
          >
            <span className="start-name">まちがえた問題</span>
            <span className="start-meta">{wrongAll > 0 ? wrongAll + "問" : "なし"}</span>
          </button>
        </div>
      </div>

      <div className="panel">
        <h2 className="panel-title">分野べつの正答率</h2>
        {stats.every((s) => s.n === 0) ? (
          <p className="empty">といた問題がここに記録されます。</p>
        ) : (
          <ul className="bars">
            {stats.map((s) => (
              <li key={s.s + s.f} className={"bar-row " + SUB_CLASS[s.s]}>
                <span className="bar-label">{s.f}</span>
                <span className="bar-track">
                  <span className="bar-fill" style={{ width: (s.rate === null ? 0 : s.rate) + "%" }} />
                </span>
                <span className="bar-val">{s.rate === null ? "—" : s.rate + "%"}</span>
              </li>
            ))}
          </ul>
        )}
        {weak && weak.rate !== null && weak.rate < 100 ? (
          <p className="hint">いま手ごわいのは「{weak.f}」（{weak.rate}%）。</p>
        ) : null}
      </div>

      <button className="link" onClick={props.onData}>
        記録の書き出し・読みこみ
      </button>
      <p className="ver">ver {APP_VERSION}</p>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 出題画面                                                            */
/* ------------------------------------------------------------------ */
function Quiz(props) {
  const set = props.set;
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [log, setLog] = useState([]);

  const item = set[idx];
  const answered = picked !== null;
  const correct = answered && picked === item.answer;

  function choose(i) {
    if (answered) return;
    setPicked(i);
    props.onAnswer(item.q, i === item.answer);
  }

  function next() {
    const nextLog = log.concat([{ q: item.q, ok: picked === item.answer }]);
    if (idx + 1 >= set.length) {
      props.onFinish(nextLog);
    } else {
      setLog(nextLog);
      setPicked(null);
      setIdx(idx + 1);
    }
  }

  return (
    <div className={"screen quiz " + SUB_CLASS[item.q.s]}>
      <div className="quiz-head">
        <button className="back" onClick={props.onQuit} aria-label="やめる">
          ←
        </button>
        <span className="tag">
          {item.q.s}・{item.q.f}
        </span>
        <span className="dots">
          {set.map((_, i) => {
            let c = "dot";
            if (i < log.length) c += log[i].ok ? " dot-o" : " dot-x";
            else if (i === idx) c += answered ? (correct ? " dot-o" : " dot-x") : " dot-now";
            return <span key={i} className={c} />;
          })}
        </span>
      </div>

      <div className="stem">
        <p className="stem-text">{item.q.q}</p>
      </div>

      <div className="choices">
        {item.choices.map((c, i) => {
          let cls = "choice";
          if (answered) {
            cls += " locked";
            if (i === item.answer) cls += " is-answer";
            else if (i === picked) cls += " is-miss";
          }
          return (
            <button key={i} className={cls} onClick={() => choose(i)} disabled={answered}>
              {c}
            </button>
          );
        })}
      </div>

      <div className="foot">
        {answered ? (
          <button className={"result-bar " + (correct ? "ok" : "ng")} onClick={next}>
            <span className="mark">{correct ? "○" : "×"}</span>
            <span className="explain">{item.q.e}</span>
            <span className="go">{idx + 1 >= set.length ? "けっか" : "つぎへ"}</span>
          </button>
        ) : (
          <p className="foot-hint">{idx + 1} / {set.length}</p>
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 結果画面                                                            */
/* ------------------------------------------------------------------ */
function Result(props) {
  const log = props.log;
  const ok = log.filter((l) => l.ok).length;
  const missed = log.filter((l) => !l.ok);

  return (
    <div className="screen result">
      <div className="score">
        <p className="score-num">
          {ok}
          <span className="score-den">/ {log.length}</span>
        </p>
        <p className="score-note">
          {missed.length === 0
            ? "全問正解。"
            : missed.length + "問は、つぎのセットでもう一度出ます。"}
        </p>
      </div>

      {missed.length > 0 ? (
        <ul className="review">
          {missed.map((l, i) => (
            <li key={i} className={"review-item " + SUB_CLASS[l.q.s]}>
              <p className="review-q">{l.q.q}</p>
              <p className="review-a">{l.q.c[l.q.a]}</p>
              <p className="review-e">{l.q.e}</p>
            </li>
          ))}
        </ul>
      ) : null}

      <div className="result-actions">
        <button className="start wide" onClick={props.onAgain}>
          <span className="start-name">もう10問</span>
        </button>
        <button className="start wide" onClick={props.onHome}>
          <span className="start-name">ホームへ</span>
        </button>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* データ画面                                                          */
/* ------------------------------------------------------------------ */
function DataPanel(props) {
  const [text, setText] = useState("");
  const [msg, setMsg] = useState("");
  const fileRef = useRef(null);

  const json = JSON.stringify(props.store);

  function download() {
    try {
      const blob = new Blob([json], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "ichimon-" + today() + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      setMsg("ファイルを書き出しました。");
    } catch (e) {
      setMsg("書き出せませんでした。下のテキストをコピーして保存してください。");
    }
  }

  function copy() {
    try {
      navigator.clipboard.writeText(json);
      setMsg("コピーしました。");
    } catch (e) {
      setMsg("コピーできませんでした。長押しで選んでコピーしてください。");
    }
  }

  function applyText(raw) {
    try {
      const obj = JSON.parse(raw);
      if (!obj || typeof obj !== "object" || typeof obj.q !== "object") throw new Error("形式");
      props.onImport(Object.assign(emptyStore(), obj));
      setMsg("読みこみました。いまの記録は置きかわりました。");
    } catch (e) {
      setMsg("読みこめませんでした。JSONの中身を確認してください。");
    }
  }

  function pickFile(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => applyText(String(r.result));
    r.onerror = () => setMsg("ファイルを開けませんでした。");
    r.readAsText(f);
  }

  return (
    <div className="screen data">
      <div className="quiz-head">
        <button className="back" onClick={props.onHome} aria-label="もどる">
          ←
        </button>
        <span className="tag">記録の書き出し・読みこみ</span>
        <span className="dots" />
      </div>

      <div className="panel">
        <h2 className="panel-title">書き出す</h2>
        <div className="row2">
          <button className="link-btn" onClick={download}>
            ファイルに保存
          </button>
          <button className="link-btn" onClick={copy}>
            テキストをコピー
          </button>
        </div>
        <textarea className="ta" readOnly value={json} rows={4} />
      </div>

      <div className="panel">
        <h2 className="panel-title">読みこむ</h2>
        <p className="empty">読みこむと、いまの記録は置きかわります。</p>
        <div className="row2">
          <button className="link-btn" onClick={() => fileRef.current && fileRef.current.click()}>
            ファイルを選ぶ
          </button>
          <button className="link-btn" onClick={() => applyText(text)} disabled={!text.trim()}>
            貼りつけた内容を読む
          </button>
        </div>
        <input
          ref={fileRef}
          type="file"
          accept="application/json,.json"
          onChange={pickFile}
          style={{ display: "none" }}
        />
        <textarea
          className="ta"
          value={text}
          rows={4}
          placeholder="ここにJSONを貼りつけます"
          onChange={(e) => setText(e.target.value)}
        />
      </div>

      {msg ? <p className="msg">{msg}</p> : null}

      <button className="link" onClick={props.onReset}>
        記録をすべて消す
      </button>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* ルート                                                              */
/* ------------------------------------------------------------------ */
function App() {
  const [store, setStore] = useState(loadStore);
  const [view, setView] = useState("home");
  const [set, setSet] = useState([]);
  const [log, setLog] = useState([]);
  const lastStart = useRef({ subject: null, onlyWrong: false });

  useEffect(() => {
    saveStore(store);
  }, [store]);

  function start(subject, onlyWrong) {
    const s = buildSet(store, subject, onlyWrong);
    if (!s.length) return;
    lastStart.current = { subject: subject, onlyWrong: onlyWrong };
    setStore((prev) => touchStreak(Object.assign({}, prev)));
    setSet(s);
    setView("quiz");
  }

  function onAnswer(q, ok) {
    setStore((prev) => {
      const next = Object.assign({}, prev);
      next.q = Object.assign({}, prev.q);
      const r = Object.assign({ o: 0, x: 0, w: 0, s: 0 }, prev.q[q.id]);
      if (ok) {
        r.o += 1;
        if (r.w === 1) {
          r.s += 1;
          if (r.s >= 2) {
            r.w = 0;
            r.s = 0;
          }
        }
      } else {
        r.x += 1;
        r.w = 1;
        r.s = 0;
      }
      next.q[q.id] = r;
      next.recent = [q.id].concat((prev.recent || []).filter((i) => i !== q.id)).slice(0, RECENT_MAX);
      next.done = (prev.done || 0) + 1;
      return next;
    });
  }

  function finish(fullLog) {
    setLog(fullLog);
    setView("result");
  }

  if (view === "quiz" && set.length) {
    return (
      <Quiz
        set={set}
        onAnswer={onAnswer}
        onFinish={finish}
        onQuit={() => setView("home")}
      />
    );
  }
  if (view === "result") {
    return (
      <Result
        log={log}
        onAgain={() => start(lastStart.current.subject, lastStart.current.onlyWrong)}
        onHome={() => setView("home")}
      />
    );
  }
  if (view === "data") {
    return (
      <DataPanel
        store={store}
        onHome={() => setView("home")}
        onImport={(s) => {
          setStore(s);
          setView("home");
        }}
        onReset={() => {
          if (window.confirm("記録をすべて消します。よろしいですか。")) {
            setStore(emptyStore());
            setView("home");
          }
        }}
      />
    );
  }
  return <Home store={store} onStart={start} onData={() => setView("data")} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
